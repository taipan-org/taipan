name: Bug report
description: Taipan crashed, gave a wrong result, or reported an error it shouldn't have.
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: The smallest program that shows it
      description: Paste it as text. A few lines is ideal.
      render: python
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output or error, pasted as text, and the command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `taipan --version`.
      placeholder: taipan 0.11.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS, Other]
    validations:
      required: true
