name: Python code that didn't work
description: Code a Python developer would write that Taipan rejected or ran differently.
labels: [python-difference]
body:
  - type: markdown
    attributes:
      value: |
        Taipan aims to run Python-looking code as Python would, or to reject it with an error that says what to write instead. Some differences are deliberate; they're listed on [Differences from Python](https://taipan-lang.org/reference/python-differences/). Tell us about anything else.
  - type: textarea
    id: code
    attributes:
      label: The code
      description: The Taipan program, as small as you can make it.
      render: python
    validations:
      required: true
  - type: textarea
    id: taipan
    attributes:
      label: What Taipan did
      description: The error or output, pasted as text.
    validations:
      required: true
  - type: textarea
    id: python
    attributes:
      label: What Python does
      description: What the same code does in Python, if you know.
  - type: dropdown
    id: kind
    attributes:
      label: Which kind is it?
      options:
        - It didn't compile, and the error didn't say what to write instead
        - It didn't compile, but I think it should
        - It compiled, but did something different from Python
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `taipan --version`.
      placeholder: taipan 0.11.0
